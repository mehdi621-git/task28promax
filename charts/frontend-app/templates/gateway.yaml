apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ .Release.Name }}-envoy-gateway
  namespace: {{ .Release.Namespace }}
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod # Keeps your cert-manager working
spec:
  gatewayClassName: envoy-gateway
  listeners:
    - name: https-host1
      protocol: HTTPS
      port: 443
      hostname: {{ .Values.ingress.host }}
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: {{ .Release.Name }}-tls
    - name: https-host2
      protocol: HTTPS
      port: 443
      hostname: {{ .Values.ingress.host2 }}
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: {{ .Release.Name }}-tls
